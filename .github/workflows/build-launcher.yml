name: Compilar y Publicar Android Launcher

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK (Kotlin Nativo)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK Debug para Moto E20
        run: |
          cd android-launcher
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info --stacktrace

      - name: Preparar binario con nombre de versión
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          cp android-launcher/app/build/outputs/apk/debug/app-debug.apk "dist/termux-telemetry-launcher-${VERSION}.apk"

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: termux-telemetry-launcher-${{ github.ref_name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Termux Telemetry Launcher ${{ github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
