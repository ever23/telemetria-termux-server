<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo en degradé oscuro esmeralda -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1d14" />
      <stop offset="60%" stop-color="#06110b" />
      <stop offset="100%" stop-color="#020604" />
    </linearGradient>

    <!-- Pulso Neón Esmeralda -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#00E676" />
      <stop offset="80%" stop-color="#69F0AE" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <!-- Resplandor Neón Intenso -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Resplandor para el punto de nodo -->
    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Estilo App Moderna -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1a3f28" stroke-width="10" />

  <!-- Parrilla Tecnológica de Fondo -->
  <g stroke="#0e2619" stroke-width="4" stroke-dasharray="6 8" opacity="0.8">
    <line x1="80" y1="160" x2="432" y2="160" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="352" x2="432" y2="352" />
    <line x1="160" y1="80" x2="160" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="352" y1="80" x2="352" y2="432" />
  </g>

  <!-- Indicador de Status LED Superior Derecho -->
  <circle cx="396" cy="116" r="18" fill="#00E676" filter="url(#dotGlow)" />
  <circle cx="396" cy="116" r="8" fill="#ffffff" />

  <!-- Onda de Telemetría Cardíaca / Carga del Servidor -->
  <path
    d="M 72 268 L 160 268 L 192 196 L 232 344 L 280 148 L 328 300 L 360 268 L 440 268"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Nodo Central Destacado en el Pico del Gráfico -->
  <circle cx="280" cy="148" r="16" fill="#ffffff" filter="url(#dotGlow)" />
  <circle cx="280" cy="148" r="8" fill="#00E676" />

  <!-- Sigla TX Sutil en la Esquina Inferior -->
  <text x="80" y="420" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#1b452d" letter-spacing="4">TERMUX</text>
</svg>
